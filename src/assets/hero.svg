<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Generic profile silhouette</title>
  <desc id="description">A dark profile picture placeholder with mint accents and an off-white person silhouette.</desc>
  <defs>
    <radialGradient id="backdrop" cx="31%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#21372d" />
      <stop offset="43%" stop-color="#151c17" />
      <stop offset="100%" stop-color="#11100d" />
    </radialGradient>
    <linearGradient id="rim" x1="74" y1="60" x2="438" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ce6c3" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#f7f4ec" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffc857" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="silhouette" x1="164" y1="138" x2="350" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffdf6" />
      <stop offset="100%" stop-color="#ddd6cb" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.36" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="86" fill="#11100d" />
  <rect x="24" y="24" width="464" height="464" rx="72" fill="url(#backdrop)" />

  <path
    d="M76 339c68-176 185-258 359-246"
    fill="none"
    stroke="#7ce6c3"
    stroke-width="4"
    stroke-linecap="round"
    stroke-opacity="0.26"
  />
  <path
    d="M77 378c96 44 226 38 356-29"
    fill="none"
    stroke="#ffc857"
    stroke-width="3"
    stroke-linecap="round"
    stroke-opacity="0.22"
  />

  <circle cx="256" cy="243" r="146" fill="#11100d" opacity="0.46" />
  <circle cx="256" cy="243" r="139" fill="none" stroke="url(#rim)" stroke-width="2.5" opacity="0.82" />
  <circle cx="256" cy="243" r="119" fill="#ffffff" opacity="0.04" />

  <g filter="url(#softShadow)">
    <circle cx="256" cy="198" r="65" fill="url(#silhouette)" />
    <path
      d="M137 382c8-72 58-118 119-118s111 46 119 118c2 17-12 31-29 31H166c-17 0-31-14-29-31Z"
      fill="url(#silhouette)"
    />
  </g>

  <circle cx="121" cy="146" r="9" fill="#7ce6c3" opacity="0.9" />
  <circle cx="398" cy="173" r="7" fill="#ffc857" opacity="0.78" />
  <circle cx="383" cy="363" r="10" fill="#ff6f61" opacity="0.68" />
  <circle cx="161" cy="383" r="5" fill="#7ce6c3" opacity="0.62" />

  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="72"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.14"
  />
</svg>
